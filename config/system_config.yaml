      - database
      - server
      - infrastructure
      - code
      - bug
      - production
      - staging
      - docker
      - ci/cd
      - microservice
      - container
    access_level: 2
    allowed_roles:
      - admin
      - security_admin
      - executive
      - senior_manager
      - engineering_lead
      - engineer
      - team_lead
  
  security:
