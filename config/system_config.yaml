      - executive
      - senior_manager
      - manager
      - team_lead
      - employee

# Role Configuration
roles:
  admin:
    display_name: "Administrator"
    description: "Full access to all data"
    access_level: 1
  
  security_admin:
    display_name: "Security Admin"
    description: "Access to security & sensitive data"
    access_level: 1
  
  executive:
    display_name: "Executive"
    description: "High-level access"
    access_level: 1
  
  senior_manager:
    display_name: "Senior Manager"
    description: "Manager + sensitive data"
    access_level: 2
  
  engineering_lead:
    display_name: "Engineering Lead"
    description: "Engineering + infrastructure"
    access_level: 2
  
  manager:
    display_name: "Manager"
    description: "Team data access"
    access_level: 3
  
  hr_manager:
    display_name: "HR Manager"
    description: "HR data access"
    access_level: 3
  
  team_lead:
    display_name: "Team Lead"
    description: "Team-level access"
    access_level: 4
  
  engineer:
    display_name: "Engineer"
    description: "Technical data access"
    access_level: 4
  
  employee:
    display_name: "Employee"
    description: "General access"
    access_level: 4
  
  contractor:
    display_name: "Contractor"
    description: "Limited access"
    access_level: 5
  
  intern:
    display_name: "Intern"
    description: "Minimal access"
    access_level: 5
  
  public:
    display_name: "Public"
    description: "Public data only"
    access_level: 5

# Retrieval Configuration
retrieval:
  default_top_k: 5
  default_similarity_threshold: 0.3
  max_top_k: 20
  min_similarity_threshold: 0.0
  max_similarity_threshold: 1.0
  
  # Faithfulness thresholds
  faithfulness:
    high_confidence:
      min_similarity: 0.8
      min_sources: 3
    medium_confidence:
      min_similarity: 0.6
      min_sources: 2
    low_confidence:
      min_similarity: 0.4
      min_sources: 1
  
  # Query types
  query_types:
    - greeting
    - help_request
    - specific
    - cross_departmental
    - unclear
  
  # Greeting keywords
  greeting_keywords:
    - hi
    - hello
    - hey
    - greetings
    - "good morning"
    - "good afternoon"
    - "good evening"
  
  # Help keywords
  help_keywords:
    - help
    - "how to"
    - "what is"
    - explain
    - guide

# Dashboard Configuration
dashboard:
  title: "RAG System Dashboard"
  page_icon: "🤖"
  layout: "wide"
  
  pages:
    - name: "Overview"
      icon: "📊"
    - name: "Live Chat"
      icon: "💬"
    - name: "Ingestion"
      icon: "📥"
    - name: "Retrieval"
      icon: "🔍"
    - name: "Healing"
      icon: "🔧"
    - name: "Agent Spawning"
      icon: "🚀"
    - name: "System Metrics"
      icon: "📈"
    - name: "RBAC Testing"
      icon: "🔐"
  
  refresh_interval: 5  # seconds
  max_chat_history: 100
  export_format: "txt"

# Data Sources Configuration
data_sources:
  - type: "text_file"
    enabled: true
    extensions: [".txt", ".md"]
  
  - type: "incident_knowledge"
    enabled: true
    table: "incident_knowledge"
  
  - type: "pdf"
    enabled: false
    extensions: [".pdf"]
  
  - type: "json"
    enabled: false
    extensions: [".json"]

# System Settings
system:
  log_level: "INFO"
  enable_debug: false
  max_workers: 4
  timeout: 30
  
  # Auto-healing settings
  healing:
    enabled: true
    check_interval: 300  # 5 minutes
    auto_fix: false
  
  # Performance settings
  performance:
    cache_embeddings: true
    batch_size: 100
    max_memory_mb: 1024
