# RAG System Configuration
# All configurable settings in one place

# Database Configuration
database:
  path: "data/rag_system.db"
  connection_timeout: 30
  check_same_thread: false
  
  # Table Definitions - Can add/modify tables without changing code
  tables:
    documents:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: doc_id
          type: TEXT
          constraints: UNIQUE NOT NULL
        - name: source
          type: TEXT
          constraints: NOT NULL
        - name: content
          type: TEXT
          constraints: NOT NULL
        - name: chunk_id
          type: INTEGER
        - name: total_chunks
          type: INTEGER
        - name: classification
          type: TEXT
        - name: min_access_level
          type: INTEGER
        - name: created_at
          type: TIMESTAMP
        - name: updated_at
          type: TIMESTAMP
      indexes:
        - name: idx_documents_doc_id
          columns: [doc_id]
        - name: idx_documents_classification
          columns: [classification]
        - name: idx_documents_created_at
          columns: [created_at]
    
    embeddings:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: doc_id
          type: TEXT
          constraints: NOT NULL
        - name: embedding
          type: BLOB
          constraints: NOT NULL
        - name: embedding_model
          type: TEXT
          constraints: NOT NULL
        - name: created_at
          type: TIMESTAMP
      foreign_keys:
        - columns: [doc_id]
          references: documents(doc_id)
      indexes:
        - name: idx_embeddings_doc_id
          columns: [doc_id]
    
    metadata:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: doc_id
          type: TEXT
          constraints: NOT NULL
        - name: key
          type: TEXT
          constraints: NOT NULL
        - name: value
          type: TEXT
        - name: created_at
          type: TIMESTAMP
      foreign_keys:
        - columns: [doc_id]
          references: documents(doc_id)
      indexes:
        - name: idx_metadata_doc_id
          columns: [doc_id]
        - name: idx_metadata_key
          columns: [key]
    
    operations_history:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: operation_type
          type: TEXT
          constraints: NOT NULL
        - name: agent_name
          type: TEXT
          constraints: NOT NULL
        - name: status
          type: TEXT
          constraints: NOT NULL
        - name: input_data
          type: TEXT
        - name: output_data
          type: TEXT
        - name: error_message
          type: TEXT
        - name: duration_seconds
          type: REAL
        - name: user_id
          type: TEXT
        - name: created_at
          type: TIMESTAMP
      indexes:
        - name: idx_operations_type
          columns: [operation_type]
        - name: idx_operations_agent
          columns: [agent_name]
        - name: idx_operations_created_at
          columns: [created_at]
    
    agent_spawns:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: parent_agent
          type: TEXT
          constraints: NOT NULL
        - name: child_agent
          type: TEXT
          constraints: NOT NULL
        - name: task_description
          type: TEXT
        - name: status
          type: TEXT
          constraints: NOT NULL
        - name: created_at
          type: TIMESTAMP
        - name: completed_at
          type: TIMESTAMP
      indexes:
        - name: idx_spawns_parent
          columns: [parent_agent]
        - name: idx_spawns_status
          columns: [status]
    
    query_history:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: query
          type: TEXT
          constraints: NOT NULL
        - name: user_id
          type: TEXT
          constraints: NOT NULL
        - name: user_role
          type: TEXT
        - name: documents_retrieved
          type: INTEGER
        - name: answer
          type: TEXT
        - name: response_time
          type: REAL
        - name: success
          type: BOOLEAN
        - name: created_at
          type: TIMESTAMP
      indexes:
        - name: idx_query_user
          columns: [user_id]
        - name: idx_query_created_at
          columns: [created_at]
    
    system_metrics:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: metric_name
          type: TEXT
          constraints: NOT NULL
        - name: metric_value
          type: REAL
          constraints: NOT NULL
        - name: metric_type
          type: TEXT
        - name: created_at
          type: TIMESTAMP
      indexes:
        - name: idx_metrics_name
          columns: [metric_name]
        - name: idx_metrics_created_at
          columns: [created_at]
    
    healing_operations:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: operation_type
          type: TEXT
          constraints: NOT NULL
        - name: target_doc_ids
          type: TEXT
        - name: reason
          type: TEXT
        - name: status
          type: TEXT
          constraints: NOT NULL
        - name: results
          type: TEXT
        - name: created_at
          type: TIMESTAMP
        - name: completed_at
          type: TIMESTAMP
      indexes:
        - name: idx_healing_type
          columns: [operation_type]
        - name: idx_healing_status
          columns: [status]
    
    incident_knowledge:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: platform
          type: TEXT
        - name: incident_description
          type: TEXT
        - name: incident_severity
          type: TEXT
        - name: resource_type
          type: TEXT
        - name: l1_triage
          type: TEXT
        - name: l2_triage
          type: TEXT
        - name: final_resolution
          type: TEXT
        - name: impacted_dollar
          type: REAL
        - name: created_at
          type: TIMESTAMP
      indexes:
        - name: idx_incident_platform
          columns: [platform]
        - name: idx_incident_severity
          columns: [incident_severity]
    
    agent_memory:
      columns:
        - name: id
          type: INTEGER
          constraints: PRIMARY KEY AUTOINCREMENT
        - name: agent_name
          type: TEXT
          constraints: NOT NULL
        - name: memory_key
          type: TEXT
          constraints: NOT NULL
        - name: memory_value
          type: TEXT
        - name: memory_type
          type: TEXT
        - name: created_at
          type: TIMESTAMP
        - name: expires_at
          type: TIMESTAMP
      indexes:
        - name: idx_memory_agent
          columns: [agent_name]
        - name: idx_memory_key
          columns: [memory_key]

