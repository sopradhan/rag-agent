# LLM Configuration
# Define multiple LLM providers - system will use the first available or specified provider

llm_providers:
  openai:
    type: "openai"
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2000
    enabled: false
    
  anthropic:
    type: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    model: "claude-3-sonnet-20240229"
    temperature: 0.7
    max_tokens: 2000
    enabled: false
    
  azure_openai:
    type: "azure_openai"
    api_key_env: "AZURE_OPENAI_API_KEY"
    endpoint_env: "AZURE_OPENAI_ENDPOINT"
    deployment_name: "gpt-4o-mini"  # Lite model for hackathon
    api_version: "2024-08-01-preview"  # Latest version with tool calling
    temperature: 0.7
    max_tokens: 2000
    enabled: false  # Set to true when you get the key at hackathon
    
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    model: "qwen2.5:0.5b"  # Lightweight 1.9GB with tool calling
    # When phi3:mini finishes downloading, switch to: "phi3:mini" (2.3GB, optimized)
    temperature: 0.3
    enabled: true
    
  huggingface:
    type: "huggingface"
    api_key_env: "HUGGINGFACE_API_KEY"  # Set in .env file
    model: "meta-llama/Llama-3.3-70B-Instruct"
    temperature: 0.7
    max_tokens: 1024
    enabled: false

# Default provider to use
default_provider: "ollama"

# Embedding configuration
embedding_providers:
  openai:
    type: "openai"
    api_key_env: "OPENAI_API_KEY"
    model: "text-embedding-3-small"
    enabled: false
    
  azure_openai:
    type: "azure_openai"
    api_key_env: "AZURE_OPENAI_API_KEY"
    endpoint_env: "AZURE_OPENAI_ENDPOINT"
    deployment_name: "text-embedding-3-small"  # Azure embedding deployment
    api_version: "2024-08-01-preview"
    enabled: false  # Set to true if using Azure for embeddings
    
  sentence_transformers:
    type: "sentence_transformers"
    model: "all-MiniLM-L6-v2"
    enabled: true
    
  huggingface:
    type: "huggingface"
    api_key_env: "HUGGINGFACE_API_KEY"  # Set in .env file
    model: "sentence-transformers/all-mpnet-base-v2"
    enabled: false
    
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"
    enabled: false

default_embedding_provider: "sentence_transformers"
